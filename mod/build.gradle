plugins {
	id 'net.fabricmc.fabric-loom' version "${loom_version}"
}

repositories {
	// Add repositories to retrieve artifacts from in here.
	// You should only use this when depending on other mods because
	// Loom adds the essential maven repositories to download Minecraft and libraries from automatically.
	// See https://docs.gradle.org/current/userguide/declaring_repositories.html
	// for more information about repositories.
}

loom {
	splitEnvironmentSourceSets()

	runs {
		// Runs every @GameTest headlessly, then exits. Fails the build if any test fails.
		gametest {
			server()
			name = "Game Test"
			vmArg "-Dfabric-api.gametest"
			vmArg "-Dfabric-api.gametest.report-file=${project.layout.buildDirectory.get()}/gametest/junit.xml"
			runDir "build/gametest"
		}

		// Opens the game in a real client, drives the enchanting screen and saves screenshots to
		// build/clientgametest/screenshots. Needs a display.
		clientGametest {
			client()
			name = "Client Game Test"
			vmArg "-Dfabric.client.gametest"
			runDir "build/clientgametest"
		}
	}

	mods {
		"superawesomecraft" {
			sourceSet sourceSets.main
			sourceSet sourceSets.client
		}
	}
}

dependencies {
	// To change the versions see the gradle.properties file
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	implementation "net.fabricmc:fabric-loader:${project.loader_version}"

	// Fabric API. This is technically optional, but you probably want it anyway.
	implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"
}

processResources {
	def version = project.version
	inputs.property "version", version

	filesMatching("fabric.mod.json") {
		expand "version": version
	}
}

tasks.withType(JavaCompile).configureEach {
	it.options.release = 25
}

java {
	// Loom will automatically attach sourcesJar to a RemapSourcesJar task and to the "build" task
	// if it is present.
	// If you remove this line, sources will not be generated.
	withSourcesJar()

	toolchain {
		languageVersion = JavaLanguageVersion.of(25)
	}
}



// Builds build/modpack/SuperAwesomeCraft-<version>.mrpack for Prism Launcher or the Modrinth App.
// Fabric API is downloaded from Modrinth; bump its entry in modpack/modrinth.index.json
// whenever fabric_api_version changes.
tasks.register("modpack", Zip) {
	group = "build"
	description = "Builds a Modrinth modpack (.mrpack) containing this mod."

	def props = [
		version          : project.version,
		minecraft_version: project.minecraft_version,
		loader_version   : project.loader_version,
	]
	inputs.properties props

	archiveBaseName = "SuperAwesomeCraft"
	archiveExtension = "mrpack"
	destinationDirectory = layout.buildDirectory.dir("modpack")

	from("modpack/modrinth.index.json") {
		expand props
	}
	from(tasks.named("jar")) {
		into "overrides/mods"
	}
}
